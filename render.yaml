services:
  - type: web
    name: policyiq-python
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run main.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: LOVABLE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
